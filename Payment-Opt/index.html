<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h2 class="heading">channel Subscription Using Cards</h2>
    <div class="subscribe">
        <input type="checkbox" name="subsrc" id="channel">
        <label for="channel">Subscribe Now</label>
    </div>
    <fieldset>
        <legend>Patment-Options</legend>
    <div class="options">
        <input type="radio" name="card" id="rupayCard">
        <label for="rupayCard">RuPay Card</label> <br>

        <input type="radio" name="card" id="visaCard">
        <label for="visaCard">Visa Card</label> <br>

        <input type="radio" name="card" id="masterCard">
        <label for="masterCard">Master Card</label> <br>

        <button type="submit" id="mySubmit">submit</button>
    </div>
    </fieldset>

    <div class="result">
        <p id="subResult"></p>
        <p id="cardResult"></p>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
